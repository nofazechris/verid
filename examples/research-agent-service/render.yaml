# One-click-ish deploy on Render (https://render.com): New → Blueprint → point at a repo containing this folder.
# Set the secret values in the dashboard when prompted. Not tested by the Verid project; any host that runs Node 18+ works.
services:
  - type: web
    name: verid-research-agent
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: VERID_URL            # https://YOUR-VERID-HOST
        sync: false
      - key: VERID_API_KEY
        sync: false
      - key: AGENT_ACCESS_TOKEN
        generateValue: true
      - key: ANTHROPIC_API_KEY    # optional
        sync: false
